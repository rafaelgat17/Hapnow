<div class="dashboard-container">
  <header>
    <h1>Dashboard de Hapnow</h1>
    <button (click)="cerrarSesion()" class="btn-logout">Cerrar sesión</button>
  </header>

  <div class="bienvenida" *ngIf="usuario">
    <h2>¡Bienvenido, {{ usuario.nombre }}!</h2>
    <p>Email: {{ usuario.email }}</p>
    <p>Reputación: {{ usuario.reputacion }}</p>
    <p>Eventos creados: {{ usuario.eventosCreados }}</p>
    <p>Eventos asistidos: {{ usuario.eventosAsistidos }}</p>
  </div>

  <div class="contenido">
    <p>Dashboard en construcción...</p>
    <p>Aquí irá el mapa, eventos, etc.</p>
  </div>
</div>
